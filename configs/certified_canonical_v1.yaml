protocol: vifinqa_certified_canonical_v1
schema_version: 1

# Phase 0 uses one explicit extraction lineage only.  Do not replace these
# paths with artifacts/table_assets.jsonl: that 45,888-table inventory is not
# the 29,509-table V10/V2/V3 lineage.
inputs:
  raw_tables: artifacts/kaggle_runs/notebook5554bd790d_v10_20260811/vifinqa_review_bundle/tables.jsonl
  structured_v2: artifacts/kaggle_runs/notebook5554bd790d_v10_20260811/vifinqa_review_bundle/tables_structured_v2.jsonl
  evidence_context_v3: artifacts/kaggle_runs/notebook5554bd790d_v10_20260811/vifinqa_review_bundle/tables_evidence_context_v3.jsonl
  preprocessing_normalized: artifacts/research/preprocessing_v2_run_003/normalized_tables_v2.jsonl
  preprocessing_manifest: artifacts/research/preprocessing_v2_run_003/preprocessing_manifest_v2.json

validate_sidecar_manifests: true

# Six disjoint, deterministic buckets x 45 packets targets a 270-table
# Phase 3 evaluation set.  These are research packets, never training labels.
benchmark:
  packets_per_bucket: 45
  target_min_packets: 250
  target_max_packets: 300
  require_target_range: true
