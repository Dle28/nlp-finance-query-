protocol: vifinqa_ccl_phase3_bakeoff_v1
schema_version: 1

inputs:
  ccl_release_manifest: artifacts/research/certified_canonical_v1_run_002/release_manifest.json
  benchmark_packets: artifacts/research/certified_canonical_v1_run_002/benchmark_packets_v1.jsonl

# Each model stays strictly below 14.7B parameters. A route prepares immutable
# requests only; model execution and response validation are separate gates.
routes:
  - route_id: qwen3_8b_primary
    model_id: Qwen/Qwen3-8B
    revision: main
    parameter_count_billions: 8.2
    modality: text
    enabled: true
    buckets:
      - review_ready
      - ambiguous_heading
      - generic_semantics
      - text_repair
      - column_path
      - period_unit_gap
    max_packets: 270
    purpose: primary_evidence_anchored_semantic_proposal

  - route_id: gemma3_12b_challenger
    model_id: google/gemma-3-12b-it
    revision: main
    parameter_count_billions: 12.0
    modality: text
    enabled: true
    buckets:
      - ambiguous_heading
      - generic_semantics
      - text_repair
      - column_path
      - period_unit_gap
    max_packets: 225
    purpose: independent_challenger_on_nontrivial_packets

  - route_id: qwen25_vl_7b_visual_escalation
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    revision: main
    parameter_count_billions: 7.0
    modality: vision
    enabled: false
    disabled_reason: requires_hash_bound_source_page_images_not_in_phase_0_to_2_packet
    buckets:
      - ambiguous_heading
      - column_path
      - period_unit_gap
    max_packets: 135
    purpose: source_page_layout_escalation_only
