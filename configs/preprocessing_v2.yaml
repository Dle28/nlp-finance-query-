protocol: vifinqa_preprocessing_v2
schema_version: 2

inputs:
  # This is the current immutable 29,509-table review snapshot. The larger
  # 45,888-row artifacts/table_assets.jsonl is a corpus inventory from a
  # different extraction lineage and must not be silently joined to V2/V3.
  table_assets: artifacts/kaggle_runs/notebook5554bd790d_v10_20260811/vifinqa_review_bundle/tables.jsonl
  structured_v2: artifacts/kaggle_runs/notebook5554bd790d_v10_20260811/vifinqa_review_bundle/tables_structured_v2.jsonl
  evidence_context_v3: artifacts/kaggle_runs/notebook5554bd790d_v10_20260811/vifinqa_review_bundle/tables_evidence_context_v3.jsonl

validate_sidecar_manifests: true

labels:
  canonical_human:
    path: data/labels/human_verified_p2.jsonl
    role: current_benchmark_supervision
    active_benchmark_supervision: true
  canonical_machine_silver:
    path: data/labels/machine_silver_labels_1012_replanned_context_v3.jsonl
    role: current_benchmark_supervision
    active_benchmark_supervision: true
  synthetic_execution_verified:
    path: artifacts/research/synthetic_finance_curriculum_v1_run_001/synthetic_finance_curriculum_v1.jsonl
    role: synthetic_separate_from_benchmark_labels
  legacy_retriever_pilot:
    path: data/labels/retriever_labels_v2.jsonl
    role: historical_do_not_sum
  pending_metadata_approval:
    path: data/labels/grounding_adjudication_reviews_v3/person1_v3_metadata_human_approval_queue_v1.jsonl
    role: proposal_not_label

# Exact, source-audited OCR substitutions only. Numeric-changing rules are
# blocked by code even if they are accidentally added here.
text_repairs:
  - id: ocr_luu_chuyen
    source: LUÙ CHUYÊN
    replacement: LƯU CHUYỂN
    confidence: 0.99
  - id: ocr_thuyet_minh
    source: THUYÊT MINH
    replacement: THUYẾT MINH
    confidence: 0.99
  - id: ocr_ket_qua
    source: KẾT QUÀ
    replacement: KẾT QUẢ
    confidence: 0.99
  - id: ocr_tien_gui
    source: tiến gửi
    replacement: tiền gửi
    confidence: 0.98
  - id: ocr_suy_giam
    source: suy giám
    replacement: suy giảm
    confidence: 0.98
  - id: ocr_tra_truoc
    source: Trà trước
    replacement: Trả trước
    confidence: 0.98

review_sample_per_reason: 4
