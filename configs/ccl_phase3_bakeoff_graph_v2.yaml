protocol: vifinqa_ccl_phase3_bakeoff_v1
schema_version: 1

# Supersedes the lexical-citation packet set used by the dispatched Kaggle v5
# route. Each packet from this run carries a finite Evidence Relation Graph;
# model proposals must select graph IDs and cannot generate citations.
inputs:
  ccl_release_manifest: artifacts/research/certified_canonical_v1_run_003/release_manifest.json
  benchmark_packets: artifacts/research/certified_canonical_v1_run_003/benchmark_packets_v1.jsonl

# A P100 cannot materialize dense attention for the full packet graph.  This
# preserves a valid, deterministic subgraph per request and marks any displayed
# raw-cell prefix as a preview of its hash-bound full source text.
request_compaction:
  max_request_payload_characters: 7000
  max_model_input_tokens: 4160
  max_anchor_display_characters: 384
  max_selectable_anchors: 36
  max_relations: 48

routes:
  - route_id: qwen3_8b_primary_graph_v2
    model_id: Qwen/Qwen3-8B
    revision: main
    parameter_count_billions: 8.2
    modality: text
    enabled: true
    buckets:
      - review_ready
      - ambiguous_heading
      - generic_semantics
      - text_repair
      - column_path
      - period_unit_gap
    max_packets: 270
    purpose: finite_graph_semantic_proposal

  - route_id: gemma3_12b_challenger_graph_v2
    model_id: google/gemma-3-12b-it
    revision: main
    parameter_count_billions: 12.0
    modality: text
    enabled: true
    buckets:
      - ambiguous_heading
      - generic_semantics
      - text_repair
      - column_path
      - period_unit_gap
    max_packets: 225
    purpose: finite_graph_independent_challenge

  - route_id: qwen25_vl_7b_visual_graph_v2
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    revision: main
    parameter_count_billions: 7.0
    modality: vision
    enabled: false
    disabled_reason: requires_hash_bound_source_page_images_not_in_graph_v2_packet
    buckets:
      - ambiguous_heading
      - column_path
      - period_unit_gap
    max_packets: 135
    purpose: source_page_layout_escalation_only
