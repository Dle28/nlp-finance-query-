protocol: vifinqa_ccl_phase3_bakeoff_v1
schema_version: 1

# This is a diagnostic smoke, not a replacement for V3.3.  The five packets
# were selected from the V3.3 source-profile audit: two balance-sheet, two
# income-statement and one cash-flow statement headings, each with a literal
# Phase 4 span.  Exact packet IDs prevent bucket order from silently changing
# the evaluation slice.
inputs:
  ccl_release_manifest: artifacts/research/certified_canonical_v1_run_003/release_manifest.json
  benchmark_packets: artifacts/research/certified_canonical_v1_run_003/benchmark_packets_v1.jsonl

request_compaction:
  max_request_payload_characters: 7000
  max_model_input_tokens: 4160
  max_anchor_display_characters: 384
  max_selectable_anchors: 36
  max_relations: 48

task_contract:
  name: source_profile_constrained_statement_smoke
  fields:
    - table_semantics
  instructions:
    - Classify only the table's source-backed financial-statement profile, or abstain.
    - A numbered note or a broad report heading is not a complete table semantic type.
  field_value_constraints:
    table_semantics:
      allowed_proposed_values:
        - balance_sheet
        - income_statement
        - cash_flow_statement
  field_relation_constraints:
    table_semantics:
      - heading_scopes_table

routes:
  - route_id: qwen3_8b_statement_profile_v34_smoke
    model_id: Qwen/Qwen3-8B
    revision: main
    parameter_count_billions: 8.2
    modality: text
    enabled: true
    packet_ids:
      - e57c6a758ed470183301bb365750a228b24719da4690f249e0f347b8127b7fe0
      - 66ace8cb63bcc2bb897b58c82f23b3db73561f358ccfcee9b9b07dd5dcf25965
      - c7ae57ee254c112446ccb4766782c476d0d4cbaf9e73c1afe50b45db59e4c6ad
      - e81d4cb422b7bead7162f0000e363745201cd49c192a3b1f3a8479ec28ac1f9c
      - ccd0e14d9502b3554e942a324a7db9cb6a4d1d121900b5b67ff3600fb48f8c6c
    max_packets: 5
    purpose: source_profile_constrained_statement_semantic_smoke
