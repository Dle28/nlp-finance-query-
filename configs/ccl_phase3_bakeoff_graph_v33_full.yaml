protocol: vifinqa_ccl_phase3_bakeoff_v1
schema_version: 1

# Full Phase 3 proposal-only Qwen route, authorized by the V3.3 5/5 smoke
# audit. It must remain immutable and be audited before any later verifier.
inputs:
  ccl_release_manifest: artifacts/research/certified_canonical_v1_run_003/release_manifest.json
  benchmark_packets: artifacts/research/certified_canonical_v1_run_003/benchmark_packets_v1.jsonl

request_compaction:
  max_request_payload_characters: 7000
  max_model_input_tokens: 4160
  max_anchor_display_characters: 384
  max_selectable_anchors: 36
  max_relations: 48

routes:
  - route_id: qwen3_8b_primary_graph_v33_full
    model_id: Qwen/Qwen3-8B
    revision: main
    parameter_count_billions: 8.2
    modality: text
    enabled: true
    buckets:
      - review_ready
      - ambiguous_heading
      - generic_semantics
      - text_repair
      - column_path
      - period_unit_gap
    max_packets: 270
    purpose: finite_graph_relation_only_semantic_proposal
