<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600, initial-scale=1">
  <title>AI GURU — diagram</title>
  <style>
    html, body { margin: 0; padding: 0; background: #FAF9F5; }
    body { width: 1600px; min-height: 600px; overflow: hidden; }
    svg { display: block; width: 1600px; height: 600px; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="run-guide-v2-title run-guide-v2-desc">
  <title id="run-guide-v2-title">Hướng dẫn chạy AI GURU</title>
  <desc id="run-guide-v2-desc">Bốn chặng vận hành gồm chuẩn bị môi trường, tạo proposal, chạy E2E và đọc report cùng artifact.</desc>
  <defs>
    <marker id="run-guide-v2-arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#52657A"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="#FAF9F5"/>
  <text x="48" y="52" fill="#1F8A89" font-size="12" font-weight="600" letter-spacing="0.18em" font-family="'Geist','Noto Sans',Arial,sans-serif">RUN GUIDE / FROM ZERO TO OUTPUT</text>
  <text x="48" y="92" fill="#0B2545" font-size="28" font-weight="600" font-family="'Instrument Serif','Noto Serif',Georgia,serif">Chạy từ đầu đến cuối theo bốn chặng</text>
  <text x="48" y="128" fill="#52657A" font-size="16" font-family="'Geist','Noto Sans',Arial,sans-serif">Mỗi chặng có đầu vào, lệnh chạy và dấu hiệu hoàn thành riêng để người vận hành dễ kiểm tra.</text>

  <!-- connectors first -->
  <line x1="368" y1="288" x2="432" y2="288" stroke="#52657A" stroke-width="2" marker-end="url(#run-guide-v2-arrow)"/>
  <line x1="752" y1="288" x2="816" y2="288" stroke="#52657A" stroke-width="2" marker-end="url(#run-guide-v2-arrow)"/>
  <line x1="1136" y1="288" x2="1200" y2="288" stroke="#E88C55" stroke-width="2.2" marker-end="url(#run-guide-v2-arrow)"/>
  <rect x="380" y="252" width="40" height="16" rx="4" fill="#FAF9F5"/>
  <text x="400" y="264" text-anchor="middle" fill="#7A8A99" font-size="12" font-family="'Geist Mono',monospace">RUN</text>
  <rect x="764" y="252" width="40" height="16" rx="4" fill="#FAF9F5"/>
  <text x="784" y="264" text-anchor="middle" fill="#7A8A99" font-size="12" font-family="'Geist Mono',monospace">CHECK</text>
  <rect x="1148" y="252" width="40" height="16" rx="4" fill="#FAF9F5"/>
  <text x="1168" y="264" text-anchor="middle" fill="#E88C55" font-size="12" font-family="'Geist Mono',monospace">READ</text>

  <!-- cards -->
  <rect x="48" y="176" width="320" height="224" rx="8" fill="#F0F3F5" stroke="#9AAABA" stroke-width="1.2"/>
  <rect x="72" y="200" width="48" height="24" rx="4" fill="#D8E1E8"/>
  <text x="96" y="217" text-anchor="middle" fill="#52657A" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">01</text>
  <text x="208" y="252" text-anchor="middle" fill="#0B2545" font-size="20" font-weight="600" font-family="'Geist','Noto Sans',Arial,sans-serif">Chuẩn bị</text>
  <text x="208" y="280" text-anchor="middle" fill="#52657A" font-size="12" font-family="'Geist','Noto Sans',Arial,sans-serif">môi trường + dữ liệu</text>
  <rect x="72" y="312" width="272" height="56" rx="6" fill="#FFFFFF" stroke="#D6DFE2" stroke-width="1"/>
  <text x="88" y="336" fill="#0B2545" font-size="12" font-family="'Geist Mono',monospace">pip install -e ".[dev]"</text>
  <text x="88" y="356" fill="#7A8A99" font-size="12" font-family="'Geist Mono',monospace">extract_data.py → audit</text>

  <rect x="432" y="176" width="320" height="224" rx="8" fill="#E5F2EF" stroke="#1F8A89" stroke-width="1.2"/>
  <rect x="456" y="200" width="48" height="24" rx="4" fill="#C5E4DE"/>
  <text x="480" y="217" text-anchor="middle" fill="#1F8A89" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">02</text>
  <text x="592" y="252" text-anchor="middle" fill="#0B2545" font-size="20" font-weight="600" font-family="'Geist','Noto Sans',Arial,sans-serif">Tạo proposal</text>
  <text x="592" y="280" text-anchor="middle" fill="#52657A" font-size="12" font-family="'Geist','Noto Sans',Arial,sans-serif">coverage + candidate</text>
  <rect x="456" y="312" width="272" height="56" rx="6" fill="#FFFFFF" stroke="#B7DCD5" stroke-width="1"/>
  <text x="472" y="336" fill="#0B2545" font-size="12" font-family="'Geist Mono',monospace">finance-query build-submission</text>
  <text x="472" y="356" fill="#7A8A99" font-size="12" font-family="'Geist Mono',monospace">→ submission.json + report</text>

  <rect x="816" y="176" width="320" height="224" rx="8" fill="#FEF0E7" stroke="#E88C55" stroke-width="1.6"/>
  <rect x="840" y="200" width="48" height="24" rx="4" fill="#F9D8C0"/>
  <text x="864" y="217" text-anchor="middle" fill="#D46F3D" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">03</text>
  <text x="976" y="252" text-anchor="middle" fill="#0B2545" font-size="20" font-weight="600" font-family="'Geist','Noto Sans',Arial,sans-serif">Chạy E2E</text>
  <text x="976" y="280" text-anchor="middle" fill="#9C5A36" font-size="12" font-family="'Geist','Noto Sans',Arial,sans-serif">source + semantics + replay</text>
  <rect x="840" y="312" width="272" height="56" rx="6" fill="#FFFFFF" stroke="#F1CDB5" stroke-width="1"/>
  <text x="856" y="336" fill="#0B2545" font-size="12" font-family="'Geist Mono',monospace">finance-query run-e2e</text>
  <text x="856" y="356" fill="#7A8A99" font-size="12" font-family="'Geist Mono',monospace">→ receipt / certificate / abstain</text>

  <rect x="1200" y="176" width="320" height="224" rx="8" fill="#0B2545" stroke="#0B2545" stroke-width="1.2"/>
  <rect x="1224" y="200" width="48" height="24" rx="4" fill="#244A6D"/>
  <text x="1248" y="217" text-anchor="middle" fill="#D9ECEA" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">04</text>
  <text x="1360" y="252" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600" font-family="'Geist','Noto Sans',Arial,sans-serif">Đọc output</text>
  <text x="1360" y="280" text-anchor="middle" fill="#C6D5DF" font-size="12" font-family="'Geist','Noto Sans',Arial,sans-serif">report + artifact + status</text>
  <rect x="1224" y="312" width="272" height="56" rx="6" fill="#163653" stroke="#2E5A77" stroke-width="1"/>
  <text x="1240" y="336" fill="#FFFFFF" font-size="12" font-family="'Geist Mono',monospace">errors = [] ?</text>
  <text x="1240" y="356" fill="#C6D5DF" font-size="12" font-family="'Geist Mono',monospace">status ≠ accuracy</text>

  <rect x="48" y="472" width="1472" height="64" rx="8" fill="#FFF7F0" stroke="#F1CDB5" stroke-width="1"/>
  <text x="76" y="510" fill="#0B2545" font-size="16" font-weight="600" font-family="'Geist','Noto Sans',Arial,sans-serif">Dấu hiệu hoàn thành:</text>
  <text x="276" y="510" fill="#52657A" font-size="16" font-family="'Geist','Noto Sans',Arial,sans-serif">có output mới, report đọc được, record count khớp, lỗi được ghi rõ và mọi trạng thái được hiểu đúng.</text>
</svg>

</body>
</html>
