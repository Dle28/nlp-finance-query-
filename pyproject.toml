[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-query"
version = "0.1.0"
description = "Fail-closed deterministic verification pipeline for ViFinQA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Open-weight diagnostic lane only; it never answers or authorizes release.
llm = [
  "torch>=2.2",
  "transformers>=4.43",
  "huggingface_hub>=0.24",
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
]
dev = [
  "ipywidgets>=8.1",
  "pytest>=8.0",
]

[project.scripts]
finance-query = "finance_query.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Downloaded research artifacts can contain historical test snapshots.
testpaths = ["tests"]
markers = [
  "e2e: deterministic end-to-end replay contract tests",
  "local_artifacts: requires provenance-bound research artifacts excluded from Git",
]
